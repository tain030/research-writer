[package]
name = "research-writer"
version = "0.8.5"
description = "A quiet, local-first research writing editor"
authors = ["tain"]
edition = "2024"
license = "MIT"
rust-version = "1.97.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "research_writer_lib"
crate-type = ["rlib"]

[[bin]]
name = "research-writer-backend"
path = "src/main.rs"

[dependencies]
atomic-write-file = "=0.3.0"
base64 = "=0.22.1"
chardetng = "=1.0.0"
chrono = { version = "=0.4.45", features = ["serde"] }
dirs = "=6.0.0"
diffy = "=0.5.1"
encoding_rs = "=0.8.35"
flate2 = "=1.1.9"
fontdb = "=0.23.0"
keyring = "=4.1.5"
notify = "=8.2.0"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "query", "rustls", "system-proxy"] }
roxmltree = "=0.21.1"
rusqlite = { version = "=0.40.1", features = ["bundled-full"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.11.0"
tempfile = "=3.27.0"
thiserror = "=2.0.18"
tokio = { version = "=1.49.0", features = ["rt-multi-thread", "time", "net", "sync", "macros"] }
trash = "=5.2.6"
uuid = { version = "=1.20.0", features = ["v4"] }
walkdir = "=2.5.0"

[dev-dependencies]
pretty_assertions = "=1.4.1"
