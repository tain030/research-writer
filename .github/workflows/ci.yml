name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Editor and desktop bridge
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check desktop entry points
        run: |
          node --check electron/main.mjs
          node --check electron/preload.cjs
          node --check scripts/electron-dev.mjs
          node --check scripts/electron-smoke.mjs
          node --check scripts/collect-release-artifacts.mjs
          node --check scripts/release-version.mjs
          sh -n _deploy/configure-checkout.sh
          sh -n _deploy/deploy-to-server.sh
          sh -n scripts/test-linux-container.sh
          sh -n scripts/verify-local.sh
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  backend:
    name: Backend (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
          - name: macOS arm64
            os: macos-15
          - name: Windows x64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --all-targets
