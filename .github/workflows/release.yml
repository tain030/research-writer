name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Validate release tag
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
      - name: Match tag, source versions, and main
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tags must use stable SemVer such as v0.1.4."
            exit 1
          fi

          version="${tag#v}"
          node scripts/release-version.mjs check "$version"

          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The release tag must point to a commit on main."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

  quality:
    name: Full CI
    needs: preflight
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  package:
    name: Package Linux x64
    needs:
      - preflight
      - quality
    runs-on: ubuntu-22.04
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf
      - run: pnpm install --frozen-lockfile
      - name: Build Debian and AppImage packages
        run: pnpm tauri build --ci --bundles deb,appimage
      - name: Normalize and validate packages
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/release"
          appimage_check_dir="$RUNNER_TEMP/appimage-check"
          mkdir -p "$release_dir" "$appimage_check_dir"

          mapfile -t debs < <(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name "*_${RELEASE_VERSION}_amd64.deb" -print)
          mapfile -t appimages < <(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name "*_${RELEASE_VERSION}_amd64.AppImage" -print)
          if [[ "${#debs[@]}" -ne 1 || "${#appimages[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one Debian package and one AppImage."
            exit 1
          fi

          cp "${debs[0]}" "$release_dir/research-writer_amd64.deb"
          cp "${appimages[0]}" "$release_dir/research-writer_amd64.AppImage"
          chmod +x "$release_dir/research-writer_amd64.AppImage"

          test "$(dpkg-deb -f "$release_dir/research-writer_amd64.deb" Package)" = "research-writer"
          test "$(dpkg-deb -f "$release_dir/research-writer_amd64.deb" Version)" = "$RELEASE_VERSION"
          test "$(dpkg-deb -f "$release_dir/research-writer_amd64.deb" Architecture)" = "amd64"

          (
            cd "$appimage_check_dir"
            "$release_dir/research-writer_amd64.AppImage" --appimage-extract >/dev/null
          )
          test -x "$appimage_check_dir/squashfs-root/AppRun"
          test -x "$appimage_check_dir/squashfs-root/usr/bin/research-writer"

          (
            cd "$release_dir"
            sha256sum research-writer_amd64.deb research-writer_amd64.AppImage > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: |
            ${{ runner.temp }}/release/research-writer_amd64.deb
            ${{ runner.temp }}/release/research-writer_amd64.AppImage
            ${{ runner.temp }}/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs:
      - preflight
      - package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_NOTES: |
        Linux x86_64용 자동 빌드입니다. 현재 공개 배포용 코드 서명은 적용되지 않았습니다.

        Debian/Ubuntu에서는 아래처럼 기존 버전을 삭제하지 않고 바로 업그레이드할 수 있습니다.

        `sudo apt install ./research-writer_amd64.deb`
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: release-linux-x86_64
          path: release
      - name: Verify workflow artifacts
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release
            sha256sum -c SHA256SUMS
          )
          test "$(dpkg-deb -f release/research-writer_amd64.deb Package)" = "research-writer"
          test "$(dpkg-deb -f release/research-writer_amd64.deb Version)" = "$RELEASE_VERSION"
          test "$(dpkg-deb -f release/research-writer_amd64.deb Architecture)" = "amd64"
      - name: Create or resume draft release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          release_state="$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null || true)"

          if [[ "$release_state" == "false" ]]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$release_state" != "true" ]]; then
            gh release create "$tag" \
              --verify-tag \
              --draft \
              --title "Research Writer $tag" \
              --generate-notes \
              --notes "$RELEASE_NOTES"
          fi

          gh release upload "$tag" \
            release/research-writer_amd64.deb \
            release/research-writer_amd64.AppImage \
            release/SHA256SUMS \
            --clobber
          gh release edit "$tag" --draft=false --latest
          echo "published=false" >> "$GITHUB_OUTPUT"
      - name: Verify published release
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          public_dir="$RUNNER_TEMP/public-release"
          mkdir -p "$public_dir"

          release_json="$(gh release view "$tag" --json isDraft,isPrerelease,assets,url)"
          jq -e '.isDraft == false and .isPrerelease == false' <<<"$release_json" >/dev/null
          test "$(jq '.assets | length' <<<"$release_json")" -eq 3
          for asset in research-writer_amd64.deb research-writer_amd64.AppImage SHA256SUMS; do
            jq -e --arg name "$asset" \
              '.assets | any(.name == $name and .state == "uploaded")' \
              <<<"$release_json" >/dev/null
          done

          gh release download "$tag" \
            --dir "$public_dir" \
            --pattern 'research-writer_amd64.*' \
            --pattern SHA256SUMS
          (
            cd "$public_dir"
            sha256sum -c SHA256SUMS
          )
          test "$(dpkg-deb -f "$public_dir/research-writer_amd64.deb" Package)" = "research-writer"
          test "$(dpkg-deb -f "$public_dir/research-writer_amd64.deb" Version)" = "$RELEASE_VERSION"
          test "$(dpkg-deb -f "$public_dir/research-writer_amd64.deb" Architecture)" = "amd64"

          release_base="https://github.com/${GITHUB_REPOSITORY}/releases"
          curl --fail --silent --show-error --location --head --retry 5 \
            "$release_base/tag/$tag" >/dev/null
          for asset in research-writer_amd64.deb research-writer_amd64.AppImage SHA256SUMS; do
            curl --fail --silent --show-error --location --head --retry 5 \
              "$release_base/download/$tag/$asset" >/dev/null
          done
