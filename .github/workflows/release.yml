name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Validate release tag
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
      - name: Match tag, source versions, and main
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tags must use stable SemVer such as v0.7.0."
            exit 1
          fi

          version="${tag#v}"
          node scripts/release-version.mjs check "$version"

          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The release tag must point to a commit on main."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  quality:
    name: Full CI
    needs: preflight
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  package:
    name: Package ${{ matrix.name }}
    needs:
      - preflight
      - quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            id: linux-x64
            os: ubuntu-22.04
            command: pnpm exec electron-builder --linux deb AppImage --x64 --publish never
          - name: macOS Apple Silicon
            id: macos-arm64
            package_arch: arm64
            os: macos-15
            command: pnpm exec electron-builder --mac dmg zip --arm64 --publish never
          - name: macOS Intel
            id: macos-x64
            package_arch: x64
            os: macos-15-intel
            command: pnpm exec electron-builder --mac dmg zip --x64 --publish never
          - name: Windows x64
            id: windows-x64
            os: windows-2025
            command: pnpm exec electron-builder --win nsis portable --x64 --publish never
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux packaging and smoke-test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            libasound2 \
            libatspi2.0-0 \
            libgbm1 \
            libgtk-3-0 \
            libnotify4 \
            libnss3 \
            libsecret-1-0 \
            libuuid1 \
            libxss1 \
            libxtst6 \
            xauth \
            xvfb
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo build --manifest-path src-tauri/Cargo.toml --locked --release --bin research-writer-backend
      - name: Ensure the sidecar is executable
        if: runner.os != 'Windows'
        run: chmod +x src-tauri/target/release/research-writer-backend
      - name: Build native packages
        run: ${{ matrix.command }}
      - name: Boot packaged Linux application
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/electron-smoke.log"
          xvfb-run -a dist/linux-unpacked/research-writer \
            --no-sandbox \
            --remote-debugging-port=9222 >"$log" 2>&1 &
          app_pid=$!
          cleanup() {
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          node scripts/electron-smoke.mjs
          if grep -E "Unable to load preload|SyntaxError|ERR_FILE_NOT_FOUND|Refused to execute" "$log"; then
            cat "$log"
            exit 1
          fi
      - name: Collect stable release filenames
        run: node scripts/collect-release-artifacts.mjs ${{ matrix.id }} dist "${{ runner.temp }}/release"
      - name: Validate Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/release"
          test "$(dpkg-deb -f "$release_dir/research-writer_amd64.deb" Package)" = "research-writer"
          test "$(dpkg-deb -f "$release_dir/research-writer_amd64.deb" Version)" = "$RELEASE_VERSION"
          test "$(dpkg-deb -f "$release_dir/research-writer_amd64.deb" Architecture)" = "amd64"
          mkdir -p "$RUNNER_TEMP/appimage-check"
          (
            cd "$RUNNER_TEMP/appimage-check"
            "$release_dir/research-writer_x86_64.AppImage" --appimage-extract >/dev/null
          )
          test -x "$RUNNER_TEMP/appimage-check/squashfs-root/AppRun"
          test -x "$RUNNER_TEMP/appimage-check/squashfs-root/research-writer"
          test -x "$RUNNER_TEMP/appimage-check/squashfs-root/resources/backend/research-writer-backend"
      - name: Validate macOS packages
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          hdiutil verify "$RUNNER_TEMP/release/Research-Writer_macOS_${{ matrix.package_arch }}.dmg"
          unzip -t "$RUNNER_TEMP/release/Research-Writer_macOS_${{ matrix.package_arch }}.zip"
      - name: Validate Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packages = Get-ChildItem "$env:RUNNER_TEMP/release/*.exe"
          if ($packages.Count -ne 2) { throw "Expected two Windows packages." }
          foreach ($package in $packages) {
            if ($package.Length -lt 10MB) { throw "$($package.Name) is unexpectedly small." }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.id }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs:
      - preflight
      - package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_NOTES: |
        고정된 Electron/Chromium 엔진으로 Linux, macOS, Windows에서 같은 A4 편집·조판 결과를 제공합니다. 공개 코드 서명과 Apple 공증은 아직 적용되지 않았습니다.

        Debian/Ubuntu에서는 이전 버전을 지우지 말고 새 파일을 그대로 덮어 설치하면 원고와 설정을 유지한 채 업그레이드됩니다.

        `sudo apt install ./research-writer_amd64.deb`
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Generate and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          mapfile -t assets < <(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort)
          test "${#assets[@]}" -eq 8
          sha256sum "${assets[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS
          test "$(dpkg-deb -f research-writer_amd64.deb Package)" = "research-writer"
          test "$(dpkg-deb -f research-writer_amd64.deb Version)" = "$RELEASE_VERSION"
      - name: Create or update release
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --verify-tag \
              --draft \
              --title "Research Writer $tag" \
              --generate-notes \
              --notes "$RELEASE_NOTES"
          fi
          gh release upload "$tag" release/* --clobber
          gh release edit "$tag" --draft=false --latest
      - name: Verify published release
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          public_dir="$RUNNER_TEMP/public-release"
          release_json="$(gh release view "$tag" --json isDraft,isPrerelease,assets,url)"
          jq -e '.isDraft == false and .isPrerelease == false' <<<"$release_json" >/dev/null
          test "$(jq '.assets | length' <<<"$release_json")" -eq 9
          mkdir -p "$public_dir"
          gh release download "$tag" --dir "$public_dir"
          (cd "$public_dir" && sha256sum -c SHA256SUMS)
          test "$(dpkg-deb -f "$public_dir/research-writer_amd64.deb" Version)" = "$RELEASE_VERSION"
          release_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag"
          while IFS= read -r asset; do
            curl --fail --silent --show-error --location --head --retry 5 \
              "$release_base/$asset" >/dev/null
          done < <(jq -r '.assets[].name' <<<"$release_json")
