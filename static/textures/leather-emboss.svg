<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <filter id="leather-emboss" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.028 0.045" numOctaves="3" seed="41" stitchTiles="stitch" result="pebble"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.18" numOctaves="2" seed="73" stitchTiles="stitch" result="fine"/>
    <feBlend in="pebble" in2="fine" mode="multiply" result="height"/>
    <feDiffuseLighting in="height" surfaceScale="1.35" diffuseConstant="0.72" lighting-color="#f4efdf" result="emboss">
      <feDistantLight azimuth="225" elevation="55"/>
    </feDiffuseLighting>
    <feComponentTransfer in="emboss">
      <feFuncR type="linear" slope="1.2" intercept="-0.1"/>
      <feFuncG type="linear" slope="1.2" intercept="-0.1"/>
      <feFuncB type="linear" slope="1.2" intercept="-0.1"/>
      <feFuncA type="table" tableValues="0.16 0.16"/>
    </feComponentTransfer>
  </filter>
  <rect width="320" height="320" filter="url(#leather-emboss)"/>
</svg>
